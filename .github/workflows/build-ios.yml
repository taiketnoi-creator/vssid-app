name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Assets
        run: |
          npm run build

      - name: Setup Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Setup Xcode Project Settings
        run: |
          # Print Xcode SDK details
          xcrun xcodebuild -showsdks

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath $PWD/build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Export IPA (Ad-Hoc/Unsigned)
        run: |
          # Pack the compiled .app into a standard unsigned ad-hoc .ipa file
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r App.app Payload/
          zip -r -y App.ipa Payload/
          mv App.ipa $GITHUB_WORKSPACE/App.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VssID-Premium-iOS-Unsigned
          path: App.ipa
